name: Simple CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask==2.3.3 Werkzeug==2.3.7 Jinja2==3.1.2
    
    - name: Check Python syntax
      run: |
        python -m py_compile app.py
        echo "✓ Python syntax is valid"
    
    - name: Verify project structure
      run: |
        echo "Checking project files..."
        test -f app.py && echo "✓ app.py exists"
        test -f requirements.txt && echo "✓ requirements.txt exists"
        test -d templates && echo "✓ templates/ directory exists"
        test -d static && echo "✓ static/ directory exists"
        ls -la templates/
        echo "✓ All files verified"
    
    - name: Test Flask app imports
      run: |
        python -c "from app import app; print('✓ Flask app imports successfully')"
    
    - name: Deployment Status
      run: |
        echo "✓ All checks passed!"
        echo "Your app is ready for deployment"
